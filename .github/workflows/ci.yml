name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m app kb build
      - run: python -m app kb lint --strict
      - run: python -m app.validate_readable
      - run: python -m pytest -q
      - name: Check tracked public artifacts are reproducible
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-downloads
          path: |
            dist/*.zip
            dist/*.sha256
